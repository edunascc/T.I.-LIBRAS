<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastrar — T.I. Libras</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <app-header></app-header>
  <main class="auth-page container">
    <section class="auth-card">
      <h1>Criar conta</h1>
      <form id="registerForm" class="form">
        <label>Nome
          <input id="regName" type="text" required placeholder="Seu nome">
        </label>
        <label>E‑mail
          <input id="regEmail" type="email" required placeholder="seu@exemplo.com">
        </label>
        <label>Senha
          <input id="regPass" type="password" minlength="6" required placeholder="Mínimo 6 caracteres">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Criar conta</button>
          <a class="link" href="login.html">Já tenho conta</a>
        </div>
        <div id="registerFeedback" class="feedback"></div>
      </form>
    </section>
    <aside class="auth-visual">
      <div class="hero-box">
        <p>Registre-se para salvar favoritos e progresso no Sinalário.</p>
      </div>
    </aside>
  </main>
  <app-footer></app-footer>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
