<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastrar — T.I. Libras</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <app-header></app-header>

  <main class="auth-wrapper container">
    <section class="visual-side">
      <div class="visual-inner">
        <div class="brand">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <rect x="2" y="2" width="20" height="20" rx="6" fill="#8B5CF6"></rect>
            <path d="M7 12c1.5-3 6-3 7.5 0" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>T.I. Libras</h1>
        </div>

        <h2 class="hero-title">Comece sua jornada em Libras</h2>
        <p class="hero-text">Crie uma conta para salvar favoritos, acompanhar seu progresso e acessar conteúdo exclusivo.</p>
        <div class="cta-row">
          <a href="login.html" class="cta-link">Já tenho conta</a>
          <a href="sinalario.html" class="cta-btn">Explorar</a>
        </div>
      </div>
    </section>

    <aside class="form-side">
      <div class="form-card">
        <div class="logo-row">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <rect x="2" y="2" width="20" height="20" rx="6" fill="#8B5CF6"></rect>
            <path d="M7 12c1.5-3 6-3 7.5 0" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="site-name">T.I. Libras</div>
        </div>

        <div class="toggle-row" role="tablist" aria-label="Autenticação">
          <a href="login.html" class="toggle">Entrar</a>
          <a href="register.html" class="toggle active">Cadastrar</a>
        </div>

        <h3 class="card-title">Crie sua conta</h3>
        <p class="card-sub">Informe seus dados para começar.</p>

        <form id="registerForm" class="form">
          <label class="field">Nome
            <input id="regName" type="text" required placeholder="Seu nome">
          </label>
          <label class="field">E‑mail
            <input id="regEmail" type="email" required placeholder="seu@exemplo.com">
          </label>
          <label class="field">Senha
            <input id="regPass" type="password" minlength="6" required placeholder="Mínimo 6 caracteres">
          </label>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Criar conta</button>
            <a class="link" href="login.html">Já tenho conta</a>
          </div>
          <div id="registerFeedback" class="feedback"></div>
        </form>
      </div>
    </aside>
  </main>

  <app-footer></app-footer>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
