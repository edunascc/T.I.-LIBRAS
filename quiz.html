<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.I. Libras - Quiz Interativo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo"><div class="logo-icon">🤟</div> T.I Libras</a>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="praticar.html" class="active">Praticar</a>
      <a href="sinalario.html">Sinalário</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn">♿</button>
      <button class="icon-btn">👤</button>
    </div>
  </header>

  <div class="quiz-top-bar">
    <span id="quizBreadcrumb">Hardware · Questão 1 de 3</span>
    <span id="quizPercent">0% concluído</span>
  </div>

  <div class="container quiz-container">
    <div class="card quiz-card">
      <div class="quiz-header">
        <span class="q-number" id="qNum">1</span>
        <h2>Qual termo está sendo sinalizado?</h2>
      </div>
      <div class="video-quiz-box">
        <div class="video-content">
          <span style="font-size: 2.5rem;">🤟</span>
          <h4>Vídeo do Sinal em Libras</h4>
          <p>Observe atentamente e identifique o termo</p>
          <button class="quiz-play-btn">▶</button>
        </div>
      </div>
    </div>
    <div class="options-grid" id="optionsGrid">
    </div>
    <div class="quiz-actions">
      <button id="btnNext" class="btn-next" style="display: none;">Próxima →</button>
    </div>
  </div>

  <footer class="footer">
    <div class="logo">🤟 T.I Libras</div>
    <div class="footer-nav">
      <a href="#">Sobre nós</a>
      <a href="#">Ajuda</a>
      <a href="#">Contato</a>
    </div>
    <div class="footer-copy">♿ Plataforma inclusiva para surdos · 2025</div>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/quizes.js"></script>
  <div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
